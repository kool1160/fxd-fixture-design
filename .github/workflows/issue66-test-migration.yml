name: Issue 66 one-time legacy-test migration

on:
  push:
    branches:
      - governance/ai-driven-fxd-reset
    paths:
      - scripts/migrate_issue66_legacy_tests.py
      - .github/workflows/issue66-test-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue66-test-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'kool1160/fxd-fixture-design' && github.ref == 'refs/heads/governance/ai-driven-fxd-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reset branch
        uses: actions/checkout@v4
        with:
          ref: governance/ai-driven-fxd-reset
          fetch-depth: 0

      - name: Apply deterministic test migration
        id: migrate
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object tests/test_milestone_governance.py)"
          python scripts/migrate_issue66_legacy_tests.py
          after="$(git hash-object tests/test_milestone_governance.py)"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate migrated governance tests
        if: steps.migrate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_milestone_governance tests.test_governance_reset -v
          python scripts/validate_control_state.py
          python scripts/validate_legacy_milestones.py
          node scripts/fxd-backlog.mjs validate
          git diff --check

      - name: Commit migration to the same reset branch
        if: steps.migrate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FXD Issue 66 migration"
          git config user.email "issue66-migration@users.noreply.github.com"
          git add tests/test_milestone_governance.py
          git commit -m "test: align legacy governance assertions with Issue 66"
          git push origin HEAD:governance/ai-driven-fxd-reset
