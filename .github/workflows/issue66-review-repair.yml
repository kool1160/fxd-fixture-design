name: Issue 66 bounded review repair

on:
  push:
    branches:
      - governance/ai-driven-fxd-reset
    paths:
      - scripts/repair_issue66_review_findings.py
      - .github/workflows/issue66-review-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue66-review-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'kool1160/fxd-fixture-design' && github.ref == 'refs/heads/governance/ai-driven-fxd-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reset branch
        uses: actions/checkout@v4
        with:
          ref: governance/ai-driven-fxd-reset
          fetch-depth: 0

      - name: Apply bounded review repairs
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object scripts/validate_control_state.py):$(git hash-object tests/test_milestone_governance.py)"
          python scripts/repair_issue66_review_findings.py
          after="$(git hash-object scripts/validate_control_state.py):$(git hash-object tests/test_milestone_governance.py)"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate repaired findings
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_control_state.py
          python scripts/validate_legacy_milestones.py
          node scripts/fxd-backlog.mjs validate
          python -m unittest tests.test_milestone_governance tests.test_governance_reset -v
          git diff --check

      - name: Commit repair to the same PR branch
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FXD Issue 66 repair"
          git config user.email "issue66-repair@users.noreply.github.com"
          git add scripts/validate_control_state.py tests/test_milestone_governance.py
          git commit -m "fix: close PR 67 governance review findings"
          git push origin HEAD:governance/ai-driven-fxd-reset
