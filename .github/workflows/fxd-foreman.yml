name: FXD Foreman — RETIRED

on:
  workflow_dispatch:

# RETIRED BY ISSUE #66.
#
# This file remains only so an old bookmark or manual-dispatch habit fails
# loudly instead of invoking the rejected milestone-selector / one-agent
# plan-build-review-publish workflow.
#
# Current project operation is defined by docs/OPERATOR_PROTOCOL.md:
# Review-Control -> CONTINUE -> Codex -> AWAITING_REVIEW.

permissions:
  contents: read

concurrency:
  group: fxd-retired-foreman
  cancel-in-progress: true

jobs:
  retired:
    name: Refuse retired autonomous Foreman dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop and point to the accepted operator protocol
        shell: bash
        run: |
          echo "::error title=FXD Foreman retired::Issue #66 retired this autonomous workflow. It may not select milestones, invoke Codex, create branches, create pull requests, or publish project state. Use docs/OPERATOR_PROTOCOL.md and the active CURRENT.md gate."
          exit 1
